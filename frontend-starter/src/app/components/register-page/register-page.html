<section class="card auth-card">
  <h1>Créer un compte</h1>
  <p class="subtitle">Rejoignez Guitar Practice Cloud pour gérer vos backing tracks</p>

  @if (error()) {
    <div class="alert alert-error" role="alert">
      {{ error() }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span class="label-text">Nom complet</span>
      <input
        type="text"
        formControlName="name"
        placeholder="Ex: Jimi Hendrix"
        autocomplete="name"
        [class.is-invalid]="form.controls.name.touched && form.controls.name.invalid"
      />
      @if (form.controls.name.touched) {
        @if (form.controls.name.hasError('required')) {
          <small class="field-error">Le nom est obligatoire.</small>
        } @else if (form.controls.name.hasError('minlength')) {
          <small class="field-error">Le nom doit comporter au moins 2 caractères.</small>
        }
      }
    </label>

    <label>
      <span class="label-text">Adresse email</span>
      <input
        type="email"
        formControlName="email"
        placeholder="nom@exemple.com"
        autocomplete="email"
        [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
      />
      @if (form.controls.email.touched) {
        @if (form.controls.email.hasError('required')) {
          <small class="field-error">L'adresse email est obligatoire.</small>
        } @else if (form.controls.email.hasError('email')) {
          <small class="field-error">Veuillez renseigner une adresse email valide (ex: utilisateur@domaine.com).</small>
        }
      }
    </label>

    <label>
      <span class="label-text">Mot de passe</span>
      <input
        type="password"
        formControlName="password"
        placeholder="Au moins 8 caractères"
        autocomplete="new-password"
        [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
      />
      @if (form.controls.password.touched) {
        @if (form.controls.password.hasError('required')) {
          <small class="field-error">Le mot de passe est obligatoire.</small>
        } @else if (form.controls.password.hasError('minlength')) {
          <small class="field-error">Le mot de passe doit comporter au moins 8 caractères.</small>
        }
      }
    </label>

    <label>
      <span class="label-text">Confirmer le mot de passe</span>
      <input
        type="password"
        formControlName="confirmPassword"
        placeholder="Répétez votre mot de passe"
        autocomplete="new-password"
        [class.is-invalid]="form.controls.confirmPassword.touched && (form.controls.confirmPassword.invalid || form.hasError('passwordMismatch'))"
      />
      @if (form.controls.confirmPassword.touched) {
        @if (form.controls.confirmPassword.hasError('required')) {
          <small class="field-error">La confirmation du mot de passe est obligatoire.</small>
        } @else if (form.hasError('passwordMismatch')) {
          <small class="field-error">Les mots de passe ne correspondent pas.</small>
        }
      }
    </label>

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Création du compte en cours...' : 'Créer mon compte' }}
    </button>
  </form>

  <p class="auth-switch">
    Déjà inscrit ? <a routerLink="/login">Se connecter</a>
  </p>
</section>
